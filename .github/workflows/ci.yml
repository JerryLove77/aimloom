# Continuous checks for every push and pull request. Read-only: no deploy, no release, no secrets.
#
# What this covers, and what it cannot: the three Vitest projects, both typechecks, the site's
# Node and workerd suites, the privacy scanner's tests, the Rust suite on Linux and on Windows
# (including the Rust engine against the frozen parity goldens the retired PowerShell engine
# wrote), and the packager suite on a real Windows. It does not build the Setup (built once, on
# the tester's PC) and cannot observe the game.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_MANIFEST: packages/app/src-tauri/Cargo.toml

jobs:
  node:
    name: Vitest, typecheck, site, privacy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The jsdom suites die on localStorage under Node 26; 24 is the development host's version.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:site
      - run: python3 -m unittest discover -s scripts/privacy -p 'test_*.py'

  rust-linux:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri
      # A parity case without its frozen golden fails here (tests/engine_parity.rs).
      - run: cargo test --manifest-path "$CARGO_MANIFEST" --features installer-ui
        env:
          KVK_PARITY_REQUIRE: '1'

  privacy:
    name: Privacy scan (gitleaks + identifier denylist)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "$base/$asset"
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $asset\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$asset" gitleaks
          chmod +x gitleaks
      - name: gitleaks over the full history
        run: ./gitleaks git --redact --no-banner --exit-code 1
      - name: Identifier denylist scan
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: |
          if [ -z "${PRIVACY_DENYLIST:-}" ]; then
            echo "PRIVACY_DENYLIST not available; identifier scan skipped"
            exit 0
          fi
          python3 scripts/privacy/denyscan.py --tree --denylist-env PRIVACY_DENYLIST \
            --exempt scripts/privacy/scan-exempt.txt

  windows:
    name: Rust and the packager (Windows)
    runs-on: windows-latest
    steps:
      # Check out with LF line endings, as the release packages carry them. The runner's default
      # converts to CRLF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri
      - shell: pwsh
        run: cargo test --manifest-path "$env:CARGO_MANIFEST" --features installer-ui
        env:
          KVK_PARITY_REQUIRE: '1'
      # The packager that makes the folder, the ZIP and the Setup payload, on the runner's own pwsh.
      - name: The packager suite
        shell: pwsh
        run: '& pwsh -NoProfile -File scripts/installer/tests/package-build.test.ps1; if ($LASTEXITCODE -ne 0) { throw "package-build.test.ps1 exit $LASTEXITCODE" }'
