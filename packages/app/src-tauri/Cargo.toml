[package]
name = "app"
version = "0.1.6"
description = "Aimloom - KovaaK configuration manager for Windows"
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-only"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["installer-ui"]
installer-ui = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "=3.2.1", default-features = false, features = ["rustls", "json"] }
# Already in the tree transitively (via rustls' chain) at this exact version; pinned explicitly
# because the report payload's SHA-256 (the preview-equals-sent guarantee) is a direct dependency
# of this crate now, not an incidental transitive one.
sha2 = "=0.10.9"
# The Rust engine (src/engine). Each is already in the tree transitively at this exact version,
# with these features, so nothing new is downloaded: uuid for the engine's GUIDs (via tauri),
# libc for the Unix file lock the tests take, windows-sys for the Win32 calls .NET makes.
uuid = { version = "=1.26.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry"] }
