services:
  installer:
    build:
      context: .
      target: development
    init: true
    ports:
      - "127.0.0.1:${AIMLOOM_DEV_PORT:-5173}:5173"
    environment:
      # Reliable hot reload for bind mounts on Docker Desktop / WSL.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "250"
    volumes:
      # Only live browser-development inputs are mounted from the host.
      - ./packages/app/src:/workspace/packages/app/src:ro
      - ./packages/core/src:/workspace/packages/core/src:ro
      - ./packages/app/installer.html:/workspace/packages/app/installer.html:ro
      - ./packages/app/vite.config.ts:/workspace/packages/app/vite.config.ts:ro
      - ./packages/app/tsconfig.json:/workspace/packages/app/tsconfig.json:ro
      # Disposable Linux dependencies and writable Vite caches at every workspace level.
      - /workspace/node_modules
      - /workspace/packages/app/node_modules
      - /workspace/packages/core/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/installer.html').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  checks:
    profiles: [tools]
    build:
      context: .
      target: development
    init: true
    # Run a rebuilt source snapshot with independent dependencies, even while dev is running.
    command: [sh, -c, "npm test && npm run typecheck"]
